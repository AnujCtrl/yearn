[project]
name = "yearn-receiver"
version = "0.1.0"
description = "Receives yearn captures from the phone over Tailscale"
requires-python = ">=3.12"
dependencies = ["starlette", "uvicorn"]

[project.scripts]
yearn-receiver = "yearn_receiver.cli:main"

[dependency-groups]
dev = ["pytest", "anyio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yearn_receiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
